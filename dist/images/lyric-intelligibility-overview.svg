<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Lyric intelligibility — conceptual workflow</title><desc id="desc">Audio representations and hearing-loss severity information are inputs to regression models for lyric intelligibility prediction. This diagram shows the investigation, not measured results.</desc><rect width="1200" height="760" fill="#1c1c1c"/><g fill="none" stroke="#4169E1" stroke-width="2"><path d="M70 255h350v100H70zM70 440h350v100H70zM420 305h100v90h90m-18-14 18 14-18 14M420 490h100v-95M790 460v90m-14-18 14 18 14-18"/><path d="m75 165 20-30 20 60 20-100 20 140 20-70 20 45 20-90 20 60 20-25 20 40 20-25 20 15 20-45 20 65 20-75 20 45"/></g><g fill="#F4F1EA" font-family="sans-serif"><text x="70" y="75" font-size="16" letter-spacing="3">CADENZA CLIP2 / INDEPENDENT EXPERIMENTS</text><text x="95" y="315" font-size="25">AUDIO REPRESENTATIONS</text><text x="95" y="480" font-size="25">HEARING-LOSS</text><text x="95" y="515" font-size="25">SEVERITY INFORMATION</text><text x="650" y="385" font-size="37">REGRESSION</text><text x="650" y="435" font-size="37">MODELS</text><text x="650" y="595" font-size="25">LYRIC INTELLIGIBILITY</text><text x="650" y="630" font-size="25">PREDICTION</text></g><text x="70" y="700" fill="#8A8987" font-family="sans-serif" font-size="17">CONCEPTUAL DIAGRAM / NO PERFORMANCE RESULTS SHOWN</text></svg>
